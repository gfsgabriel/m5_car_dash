<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBD2 Terminal Logs</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #0a0a0c; color: #00ff66; padding: 20px; margin: 0; }
        h1 { color: #00ffff; font-size: 1.5em; border-bottom: 1px solid #222; padding-bottom: 10px; margin-bottom: 20px; }
        #terminal { background: #000; border: 1px solid #333; padding: 15px; height: 75vh; overflow-y: auto; border-radius: 6px; box-shadow: inset 0 0 10px #000; }
        .line { margin-bottom: 6px; line-height: 1.4em; }
        .tx { color: #ffaa00; }
        .sys { color: #00aaff; }
    </style>
</head>
<body>
    <h1>OBD2 LIVE TERMINAL STREAM (/logs)</h1>
    <div id="terminal"></div>

    <script>
        let gateway = `ws://${window.location.hostname}/ws`;
        let websocket;
        let term = document.getElementById("terminal");

        function initWebSocket() {
            websocket = new WebSocket(gateway);
            websocket.onmessage = function(event) {
                // Se a mensagem começar com "LOG:", joga na tela de terminal
                if (event.data.startsWith("LOG:")) {
                    let msg = event.data.substring(4);
                    let div = document.createElement("div");
                    div.className = "line";
                    
                    if (msg.startsWith("TX:")) div.className += " tx";
                    else if (msg.startsWith("SYS:")) div.className += " sys";
                    
                    div.innerText = "[" + new Date().toLocaleTimeString() + "] " + msg;
                    term.appendChild(div);
                    term.scrollTop = term.scrollHeight; // Auto-scroll para baixo
                }
            };
            websocket.onclose = function() { setTimeout(initWebSocket, 2000); };
        }
        window.onload = initWebSocket;
    </script>
</body>
</html>
