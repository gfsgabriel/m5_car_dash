<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBD2 Terminal Logs</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #0a0a0c; color: #00ff66; padding: 20px; margin: 0; }
        h1 { color: #00ffff; font-size: 1.5em; border-bottom: 1px solid #222; padding-bottom: 10px; margin-bottom: 15px; }
        .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .bar button { background: #222; color: #00ff66; border: 1px solid #444; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-family: inherit; }
        .bar button:hover { background: #333; }
        #terminal { background: #000; border: 1px solid #333; padding: 15px; height: 75vh; overflow-y: auto; border-radius: 6px; box-shadow: inset 0 0 10px #000; }
        .line { margin-bottom: 6px; line-height: 1.4em; }
        .tx { color: #ffaa00; }
        .sys { color: #00aaff; }
        .rx { color: #00ff66; }
        .err { color: #ff4444; }
    </style>
</head>
<body>
    <h1>OBD2 LIVE TERMINAL STREAM (/logs)</h1>
    <div class="bar">
        <span id="status">Conectando...</span>
        <button onclick="document.getElementById('terminal').innerHTML=''">Limpar</button>
    </div>
    <div id="terminal"></div>

    <script>
        let gateway = `ws://${window.location.hostname}/ws`;
        let websocket;
        let reconnectTimer = null;
        let term = document.getElementById("terminal");

        function setStatus(txt) { document.getElementById("status").innerText = txt; }

        function appendLog(msg) {
            let div = document.createElement("div");
            div.className = "line";

            if (msg.startsWith("TX:"))        div.className += " tx";
            else if (msg.startsWith("SYS:"))  div.className += " sys";
            else if (msg.startsWith("RX:"))   div.className += " rx";
            else if (msg.startsWith("ERR:"))  div.className += " err";

            div.innerText = "[" + new Date().toLocaleTimeString() + "] " + msg;
            term.appendChild(div);
            term.scrollTop = term.scrollHeight;
        }

        function initWebSocket() {
            if (websocket && websocket.readyState === WebSocket.OPEN) return;
            setStatus("Conectando...");
            websocket = new WebSocket(gateway);

            websocket.onopen = () => setStatus("● Conectado");

            websocket.onmessage = function(event) {
                let d;
                try { d = JSON.parse(event.data); }
                catch (e) { return; }

                // Só processa logs
                if (d.tipo === "log" && d.linha) {
                    appendLog(d.linha);
                }
            };

            websocket.onclose = function() {
                setStatus("● Desconectado — reconectando...");
                if (reconnectTimer) clearTimeout(reconnectTimer);
                reconnectTimer = setTimeout(initWebSocket, 2000);
            };

            websocket.onerror = function() { setStatus("● Erro"); };
        }

        window.onload = initWebSocket;
    </script>
</body>
</html>
